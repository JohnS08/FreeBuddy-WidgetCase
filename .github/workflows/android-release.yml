name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Configure stable debug signing key
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=freebuddy-debug-2026
          keyPassword=freebuddy-debug-2026
          keyAlias=freebuddy-debug
          storeFile=../freebuddy-debug.keystore
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Add version to APK filename
        if: startsWith(github.ref, 'refs/tags/')
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/freebuddy-case-${GITHUB_REF_NAME}.apk"

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/freebuddy-case-${{ github.ref_name }}.apk
